{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Research Summarizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-900 pb-24">

    <header class="bg-white border-b border-slate-200 px-4 py-3 sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            <span class="font-bold text-lg text-slate-800">AI Research Summarizer</span>
        </div>
        <div class="flex items-center gap-2">
            {% if user.is_authenticated %}
                <span class="text-xs text-slate-500 mr-2">Hi, {{ user.username }}</span>
                <a href="{% url 'logout' %}" class="bg-red-600 text-white px-3 py-1.5 rounded-lg text-sm font-semibold shadow-sm hover:bg-red-700">Logout</a>
            {% else %}
                <a href="{% url 'login' %}" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-sm font-semibold shadow-sm hover:bg-blue-700">Login</a>
                <a href="{% url 'register' %}" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-sm font-semibold shadow-sm hover:bg-emerald-700">Register</a>
            {% endif %}
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 pt-4">
        {% block content %}{% endblock %}
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-2 px-6 flex justify-center items-center z-50 max-w-md mx-auto shadow-lg rounded-t-xl">
        <a href="{% url 'upload' %}" class="flex flex-col items-center text-blue-600 transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            <span class="text-xs mt-1 font-medium">Upload</span>
        </a>
        <a href="{% url 'history' %}" class="ml-8 flex flex-col items-center text-slate-400 hover:text-blue-600 transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span class="text-xs mt-1 font-medium">History</span>
        </a>
    </nav>

</body>
</html>
